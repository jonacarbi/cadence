<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8">
<style>
{{fontCss}}
  :root { --surface: {{surface}}; --text: {{text}}; --accent: {{accent}}; --secondary: {{secondary}}; --accent-ink: {{accentInk}};
          /* One dim tint for eyebrow, sub and pill outline, so a frame never shows more than two text tints. */
          --dim: color-mix(in oklab, var(--text) 68%, var(--surface)); --radius: {{radius}};
          --display: "{{displayFont}}", "Inter", -apple-system, sans-serif; --body: "{{bodyFont}}", "Inter", -apple-system, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: {{w}}px; height: {{h}}px; overflow: hidden; background: var(--surface); color: var(--text); font-family: var(--body); }
  .frame { position: relative; width: 100%; height: 100vh; display: grid; }
  .photo { position: absolute; inset: 0; background: url("{{image}}") center / cover no-repeat; }
  .logo { position: absolute; height: 4.2vh; max-width: 30%; object-fit: contain; }
  .eyebrow { display: flex; align-items: center; gap: 1.6vh; font: 600 2.2vh var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  /* A mark alone in a corner is read last. Locked up with the wordmark, on the same left edge as the
     headline, it is the first ink under the void — where the eye lands in the first glance. */
  .eyebrow > .mark { height: 5vh; object-fit: contain; }
  h1 { font-family: var(--display); font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; text-wrap: balance; }
  p.sub { font-size: 2.6vh; line-height: 1.48; color: var(--dim); max-width: 34ch; }
  .pill { display: inline-block; padding: 1.4vh 3.4vh; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 2.2vh var(--body); }
  .copy > .eyebrow { margin-bottom: 1.2vh; }
  .copy > h1 { margin-bottom: 2.4vh; }
  .copy > p.sub { margin-bottom: 4.8vh; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.6'/></svg>"); }

  /* Layout A — editorial: photo top 58%, type block below on surface */
  .layout-editorial .photo { inset: 0 0 46% 0; }
  .layout-editorial .copy { position: absolute; left: 7.4vw; right: 7.4vw; top: 58%; bottom: 7.4vw; display: grid; align-content: end; }
  .layout-editorial h1 { font-size: 6.6vh; }
  .layout-editorial .logo { top: 6vw; left: 7.4vw; }

  /* Layout B — full-bleed: photo everywhere, gradient scrim, type bottom-left */
  .layout-fullbleed .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 28%, color-mix(in oklab, var(--surface) 70%, transparent) 62%, color-mix(in oklab, var(--surface) 96%, transparent) 100%); }
  .layout-fullbleed .copy { position: absolute; left: 7.4vw; right: 7.4vw; bottom: 7.4vw; display: grid; }
  .layout-fullbleed h1 { font-size: 8.4vh; }
  .layout-fullbleed .logo { top: 6vw; left: 7.4vw; }

  /* Layout C — split: type left on surface, photo right, framed with radius */
  .layout-split .photo { inset: 7.4vw 7.4vw 7.4vw 50%; border-radius: var(--radius); }
  .layout-split .copy { position: absolute; left: 7.4vw; width: 36%; top: 50%; transform: translateY(-50%); display: grid; }
  .layout-split h1 { font-size: 6.2vh; }
  .layout-split .logo { bottom: 7.4vw; left: 7.4vw; }

  /* Layout D — typographic: no photo, giant headline, accent block */
  .layout-type .photo { display: none; }
  .layout-type .copy { position: absolute; left: 7.4vw; right: 7.4vw; bottom: 7.4vw; display: grid; align-content: end; }
  .layout-type h1 { font-size: 9vh; }
  .layout-type .bar { width: 22%; height: 1.2vh; background: var(--accent); margin-top: 3vh; }
  .outline-cta .pill { background: transparent; color: var(--text); box-shadow: inset 0 0 0 .3vh var(--dim); }
  .layout-type .logo { bottom: 7.4vw; right: 7.4vw; }

  /* Carousel slide (square): centered headline over secondary surface with small photo tile */
  .layout-slide .photo { inset: 7.4vw 7.4vw 40% 7.4vw; border-radius: var(--radius); }
  .layout-slide .copy { position: absolute; left: 7.4vw; right: 7.4vw; bottom: 7.4vw; display: grid; }
  .layout-slide h1 { font-size: 6.4vh; }
  .layout-slide .counter { position: absolute; top: 4vw; right: 7.4vw; font: 600 2.2vh var(--body); opacity: .6; }
</style></head>
<body><div class="frame layout-{{layout}} {{outline}}">
  <div class="photo"></div>
  {{#logo}}<img class="logo" src="{{logo}}" alt="">{{/logo}}
  <div class="copy">
    {{#eyerow}}<div class="eyebrow">{{#lockup}}<img class="mark" src="{{lockup}}" alt="">{{/lockup}}{{eyebrow}}</div>{{/eyerow}}
    <h1>{{headline}}</h1>
    {{#sub}}<p class="sub">{{sub}}</p>{{/sub}}
    {{#cta}}<div><span class="pill">{{cta}}</span></div>{{/cta}}
    {{#bar}}<div class="bar"></div>{{/bar}}
  </div>
  {{#counter}}<div class="counter">{{counter}}</div>{{/counter}}
  <div class="grain"></div>
</div></body></html>
